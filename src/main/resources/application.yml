spring:
  application:
    name: springKB
  profiles:
    active: dev

  ai:
    # Chat: DeepSeek；Embedding: 阿里云百炼（OpenAI 兼容模式）
    model:
      chat: deepseek
      embedding: openai
    deepseek:
      base-url: https://api.deepseek.com
      chat:
        model: deepseek-chat
    openai:
      base-url: https://dashscope.aliyuncs.com/compatible-mode/v1
      # 仅用百炼做 Embedding，Chat 由 DeepSeek 提供，避免产生两个 ChatModel
      chat:
        enabled: false
      embedding:
        options:
          # 维度一旦确定后勿随意更换（需重建向量表）
          model: text-embedding-v4
          dimensions: 1024
    vectorstore:
      pgvector:
        dimensions: 1024
        index-type: HNSW
        distance-type: COSINE_DISTANCE
        initialize-schema: true
        # 用可读的字符串文档 ID（如 fake-doc-official-cds-33）
        id-type: TEXT
