spring:
  application:
    name: springKB
  profiles:
    active: dev

  # 启动时执行 schema.sql（幂等建表，CREATE TABLE IF NOT EXISTS）
  sql:
    init:
      mode: always

  # 出站 HTTP 超时：模型/Embedding 调用默认无超时，网络不通时会永久占住请求线程
  http:
    client:
      connect-timeout: 5s
      read-timeout: 60s

  ai:
    # 模型调用不自动重试：单次最坏 ≈65s，落在前端 90s 超时内，失败即返回 503 由用户手动重试
    retry:
      max-attempts: 1
    # Chat: DeepSeek；Embedding: 本地 Ollama（跨语言模型，OpenAI 兼容端点）
    model:
      chat: deepseek
      embedding: openai
    deepseek:
      base-url: https://api.deepseek.com
      chat:
        model: deepseek-chat
    openai:
      # Ollama 的 OpenAI 兼容端点；官方 OpenAI SDK 约定 base-url 需包含 /v1
      base-url: http://127.0.0.1:11434/v1
      # 仅用 Ollama 做 Embedding，Chat 由 DeepSeek 提供，避免产生两个 ChatModel
      chat:
        enabled: false
      embedding:
        options:
          # 跨语言向量模型：中英共用同一语义空间，中文查询可直接命中英文文档
          # 维度 1024 与 pgvector 表一致；换模型必须重建向量表
          model: qwen3-embedding:0.6b
    vectorstore:
      pgvector:
        dimensions: 1024
        index-type: HNSW
        distance-type: COSINE_DISTANCE
        initialize-schema: true
        # 用可读的字符串文档 ID（如 fake-doc-official-cds-33）
        id-type: TEXT

# 认证：JWT 签发与校验（生产环境务必通过 JWT_SECRET 覆盖默认值）
app:
  # 权威性加权（§6.3）：official 文档在初检相似度上加成；环境变量 APP_RAG_BOOST 可覆盖
  rag:
    boost: 0.15
    similarity-threshold: 0.5
  jwt:
    secret: ${JWT_SECRET:dev-only-change-me-springkb-rag-2026-secret-key}
    expiration-hours: ${JWT_EXPIRATION_HOURS:24}
  # 问答会话：窗口只保留最近 N 轮，TTL 天无新消息自动清理（防止僵尸会话堆积）
  conversation:
    window-size: ${CONVERSATION_WINDOW_SIZE:10}
    ttl-days: ${CONVERSATION_TTL_DAYS:30}

