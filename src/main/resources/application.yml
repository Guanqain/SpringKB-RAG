spring:
  application:
    name: springKB
  profiles:
    active: dev

  # 启动时执行 schema.sql（幂等建表，CREATE TABLE IF NOT EXISTS）
  sql:
    init:
      mode: always

  ai:
    # Chat: DeepSeek；Embedding: 阿里云百炼（OpenAI 兼容模式）
    model:
      chat: deepseek
      embedding: openai
    deepseek:
      base-url: https://api.deepseek.com
      chat:
        model: deepseek-chat
    openai:
      base-url: https://dashscope.aliyuncs.com/compatible-mode/v1
      # 仅用百炼做 Embedding，Chat 由 DeepSeek 提供，避免产生两个 ChatModel
      chat:
        enabled: false
      embedding:
        options:
          # 维度一旦确定后勿随意更换（需重建向量表）
          model: text-embedding-v4
          dimensions: 1024
    vectorstore:
      pgvector:
        dimensions: 1024
        index-type: HNSW
        distance-type: COSINE_DISTANCE
        initialize-schema: true
        # 用可读的字符串文档 ID（如 fake-doc-official-cds-33）
        id-type: TEXT

# 认证：JWT 签发与校验（生产环境务必通过 JWT_SECRET 覆盖默认值）
app:
  # 权威性加权（§6.3）：official 文档在初检相似度上加成；环境变量 APP_RAG_BOOST 可覆盖
  rag:
    boost: 0.15
  jwt:
    secret: ${JWT_SECRET:dev-only-change-me-springkb-rag-2026-secret-key}
    expiration-hours: ${JWT_EXPIRATION_HOURS:24}

