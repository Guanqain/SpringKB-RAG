# 本地开发：对接 docker-compose 中的 pgvector
spring:
  datasource:
    url: jdbc:postgresql://localhost:63892/ragdb
    username: postgres
    password: ragpass
    driver-class-name: org.postgresql.Driver

  ai:
    deepseek:
      api-key: ${DEEPSEEK_API_KEY:}
    openai:
      # 百炼 OpenAI 兼容模式；与系统环境变量名对齐（你当前设置的是 DASHSCOPE_API_KEY）
      api-key: ${DASHSCOPE_API_KEY:}
